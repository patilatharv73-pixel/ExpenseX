<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ExpenseX</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f0ff;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            color: #7657e8;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #7657e8;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #7657e8;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #6244d2;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }

        .register-link a {
            color: #7657e8;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">ExpenseX</div>

        <p class="subtitle">Welcome back</p>

        <form id="loginForm">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Create account</a>
        </div>

    </div>


    <script>
       const API_BASE_URL = "https://expensex-java.onrender.com";

        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");


        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();


            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            message.textContent = "Logging in...";
            message.style.color = "#777";


            try {

                const response = await fetch(
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email,
                            password
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    message.textContent =
                        data.message || "Login failed.";

                    message.style.color = "#d64545";

                    return;
                }


                // Save JWT token
                localStorage.setItem(
                    "expenseXToken",
                    data.token
                );


                // Save logged-in user
                localStorage.setItem(
                    "expenseXUser",
                    JSON.stringify(data.user)
                );


                message.textContent =
                    "Login successful!";

                message.style.color = "#2e9d59";


                setTimeout(function () {

                    window.location.href = "../index.html";

                }, 800);


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Could not connect to the server.";

                message.style.color = "#d64545";
            }

        });

    </script>

</body>

</html>
