<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - ExpenseX</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f0ff;
        }

        .register-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            color: #7657e8;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #7657e8;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #7657e8;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #6244d2;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }

        .login-link a {
            color: #7657e8;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="logo">ExpenseX</div>

        <p class="subtitle">Create your account</p>

        <form id="registerForm">

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p id="message"></p>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>


    <script>

        const registerForm =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");


        registerForm.addEventListener("submit", async function (event) {

            event.preventDefault();


            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            message.textContent = "Creating account...";
            message.style.color = "#777";


            try {

                const response = await fetch(
                    "http://localhost:5000/api/auth/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            name,
                            email,
                            password
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    message.textContent =
                        data.message || "Registration failed.";

                    message.style.color = "#d64545";

                    return;
                }


                message.textContent =
                    "Account created successfully!";

                message.style.color = "#2e9d59";


                registerForm.reset();


                setTimeout(function () {

                    window.location.href = "login.html";

                }, 1200);


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Could not connect to the server.";

                message.style.color = "#d64545";
            }

        });

    </script>

</body>

</html>
